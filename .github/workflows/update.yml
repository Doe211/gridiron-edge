# Updates the games, lines, and predictions every 3 hours and publishes the website.
# Also runs whenever something in the project changes (like site/lines.json),
# and can be started by hand from the Actions tab ("Run workflow").
name: Update and publish

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Raw downloads stay in this private cache (never published), so finished
      # seasons are only downloaded once.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Download games and run the model
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          BDL_KEY: ${{ secrets.BDL_KEY }}
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
          GE_CACHE: .cache
        run: python pipeline/build.py

      - name: Save the new data
        run: |
          git config user.name "gridiron-edge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Update data" -q
            git pull --rebase -q origin main && git push -q
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
